name: habit_it
description: A new Flutter project.

publish_to: "none"

version: 1.0.0

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.3.3
  form_field_validator: ^1.1.0
  provider: ^6.1.2
  sqflite: ^2.4.1
  intl: ^0.20.2
  path: ^1.9.0
  flutter_native_splash: ^2.4.3
  sliding_clipped_nav_bar: ^3.1.1
  path_provider: ^2.1.4
  get_it: ^7.2.0
  package_info_plus: ^8.0.2
  file_picker: ^8.1.2
  share_plus: ^10.0.2
  url_launcher: ^6.3.0
  permission_handler: ^11.3.1
  http: ^1.2.2
  local_auth: ^2.3.0
  supabase_flutter: ^2.5.0
  flutter_secure_storage: ^9.2.2
  uuid: ^4.5.1

dev_dependencies:
  build_runner: ^2.4.13
  flutter_launcher_icons: ^0.14.1

  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter_native_splash:
  color: "#FFFFFF"
  color_dark: "#0F172A"
  android_12:
    image: assets/images/logo.png
    color: "#FFFFFF"
    icon_background_color: "#6366F1"
    image_dark: assets/images/logo.png
    color_dark: "#0F172A"
    icon_background_color_dark: "#818CF8"
  web: false
  fullscreen: true

flutter_launcher_icons:
  image_path_ios: "assets/images/logo.png"
  android: true
  ios: true
  min_sdk_android: 21
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/lang/
    - assets/images/

  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/roboto/Roboto-Regular.ttf
        - asset: assets/fonts/roboto/Roboto-Bold.ttf
        - asset: assets/fonts/roboto/Roboto-Italic.ttf
        - asset: assets/fonts/roboto/Roboto-BoldItalic.ttf
        - asset: assets/fonts/roboto/Roboto-Light.ttf
        - asset: assets/fonts/roboto/Roboto-LightItalic.ttf
        - asset: assets/fonts/roboto/Roboto-Medium.ttf
        - asset: assets/fonts/roboto/Roboto-MediumItalic.ttf
        - asset: assets/fonts/roboto/Roboto-Thin.ttf
        - asset: assets/fonts/roboto/Roboto-ThinItalic.ttf
