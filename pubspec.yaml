name: habit_it
description: A habit-tracking app with local-first storage, biometric/PIN lock, and optional AI coach.

version: 2.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State / DI / routing
  get_it: ^9.2.1
  go_router: ^17.2.0
  rxdart: ^0.28.0

  # Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2
  path_provider: ^2.1.5

  # Models / serialization
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0  # 4.12.0+ is recommended; flutter 3.41 SDK supports 4.9

  # Crypto / auth
  crypto: ^3.0.6
  pointycastle: ^3.9.1
  local_auth: ^2.3.0

  # Notifications
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0
  permission_handler: ^11.3.1

  # Networking (AI)
  http: ^1.3.0

  # UI
  google_fonts: ^8.0.2
  font_awesome_flutter: ^11.0.0
  flutter_animate: ^4.5.2
  fluttertoast: ^8.2.8
  share_plus: ^10.0.0
  url_launcher: ^6.3.1

  # Misc
  uuid: ^4.5.1
  package_info_plus: ^8.3.0  # 8.3+ pulls win32 ^5.5.x with UnmodifiableUint8ListView fixed
  intl: ^0.20.2

  # Transitional — kept until legacy onboarding & profile screens are rewritten
  # (FND-006 follow-up). The Padlock standard does not use provider; this
  # dependency is queued for removal in the SET / AUTH sprints.
  provider: ^6.1.2

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

  # Codegen
  build_runner: ^2.4.13
  freezed: ^3.1.0
  json_serializable: ^6.8.0

  # Testing
  mocktail: ^1.0.4
  fake_async: ^1.3.1

flutter:
  uses-material-design: true

  assets:
    - assets/lang/en.json
    - assets/images/

  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/roboto/Roboto-Regular.ttf
        - asset: assets/fonts/roboto/Roboto-Bold.ttf
        - asset: assets/fonts/roboto/Roboto-Italic.ttf
        - asset: assets/fonts/roboto/Roboto-BoldItalic.ttf
        - asset: assets/fonts/roboto/Roboto-Light.ttf
        - asset: assets/fonts/roboto/Roboto-LightItalic.ttf
        - asset: assets/fonts/roboto/Roboto-Medium.ttf
        - asset: assets/fonts/roboto/Roboto-MediumItalic.ttf
        - asset: assets/fonts/roboto/Roboto-Thin.ttf
        - asset: assets/fonts/roboto/Roboto-ThinItalic.ttf
